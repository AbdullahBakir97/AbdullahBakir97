<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 579" width="1400" height="579" role="img" aria-label="DevTrust: Tools I made to check code when AI writes part of it."><defs><radialGradient id="sg" cx="1" cy="0" r="1.3"><stop offset="0" stop-color="#161b24"/><stop offset=".55" stop-color="#0d1117"/></radialGradient></defs><rect x="1" y="1" width="1398" height="577" rx="24" fill="url(#sg)" stroke="#30363d" stroke-width="2"/><text x="48" y="78" font-family="ui-monospace,SFMono-Regular,'JetBrains Mono',Menlo,Consolas,monospace" font-size="16" font-weight="700" letter-spacing="3.5" fill="#42b883">// OPEN SOURCE · PYPI</text><text x="48" y="140" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,Helvetica,Arial,sans-serif" font-size="52" font-weight="800" letter-spacing="-1.5" fill="#ffffff">DevTrust<tspan fill="#F90001">.</tspan></text><text x="48" y="184" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,Helvetica,Arial,sans-serif" font-size="25" fill="#c9d1d9">Tools I made to check code when AI writes part of it.</text><text x="48" y="236" font-family="ui-monospace,SFMono-Regular,'JetBrains Mono',Menlo,Consolas,monospace" font-size="15" font-weight="700" letter-spacing="2.5" fill="#58a6ff">WHAT</text><text x="198" y="238" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,Helvetica,Arial,sans-serif" font-size="21" fill="#c9d1d9">Architecture models of a codebase, smart test selection</text><text x="198" y="267" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,Helvetica,Arial,sans-serif" font-size="21" fill="#c9d1d9">per change, AI-aware PR review that flags invented</text><text x="198" y="296" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,Helvetica,Arial,sans-serif" font-size="21" fill="#c9d1d9">function calls, LLM tracing and cost attribution.</text><line x1="48" y1="333" x2="820" y2="333" stroke="#21262d" stroke-width="1.5"/><text x="48" y="361" font-family="ui-monospace,SFMono-Regular,'JetBrains Mono',Menlo,Consolas,monospace" font-size="15" font-weight="700" letter-spacing="2.5" fill="#58a6ff">BUILT</text><text x="198" y="363" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,Helvetica,Arial,sans-serif" font-size="21" fill="#c9d1d9">Python monorepo with GitHub Apps that run test selection</text><text x="198" y="392" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,Helvetica,Arial,sans-serif" font-size="21" fill="#c9d1d9">and PR review on every pull request.</text><line x1="48" y1="429" x2="820" y2="429" stroke="#21262d" stroke-width="1.5"/><text x="48" y="457" font-family="ui-monospace,SFMono-Regular,'JetBrains Mono',Menlo,Consolas,monospace" font-size="15" font-weight="700" letter-spacing="2.5" fill="#58a6ff">QUALITY</text><text x="198" y="459" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,Helvetica,Arial,sans-serif" font-size="21" fill="#c9d1d9">Published to PyPI with Trusted Publishing; 281 tests,</text><text x="198" y="488" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,Helvetica,Arial,sans-serif" font-size="21" fill="#c9d1d9">mypy --strict and ruff in CI.</text><line x1="48" y1="525" x2="820" y2="525" stroke="#21262d" stroke-width="1.5"/><line x1="880" y1="122" x2="1352" y2="122" stroke="#30363d" stroke-width="1.5"/><text x="886.0" y="184" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,Helvetica,Arial,sans-serif" font-size="44" font-weight="800" letter-spacing="-1" fill="#58a6ff">9</text><text x="886.0" y="216" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,Helvetica,Arial,sans-serif" font-size="19" fill="#ffffff">packages on PyPI</text><text x="1122.0" y="184" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,Helvetica,Arial,sans-serif" font-size="44" font-weight="800" letter-spacing="-1" fill="#58a6ff">281</text><text x="1122.0" y="216" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,Helvetica,Arial,sans-serif" font-size="19